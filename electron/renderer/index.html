<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <div id="add-button">
    <span id="status-dot" class="status-dot waiting"></span>
    <img src="godmodlogo.png" alt="GodMode" class="add-logo" draggable="false">
  </div>

  <!-- Export to X Button -->
  <button id="export-to-x-btn" class="export-x-btn" title="Export screenshot to X (Twitter)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
  </button>

  <button id="monetization-btn" class="monetization-btn" title="Monetization">
    $
  </button>

  <div id="monetization-modal" class="monetization-modal" aria-hidden="true">
    <div class="monetization-panel" role="dialog" aria-labelledby="monetization-title">
      <div class="monetization-header">
        <div>
          <h2 id="monetization-title">Monetization</h2>
          <p id="monetization-notice" class="monetization-notice">Sinfully local. No payment rails attached yet.</p>
        </div>
        <button id="monetization-close-btn" class="close-btn">&times;</button>
      </div>

      <div class="monetization-tabs">
        <button class="monetization-tab active" data-monetization-tab="greed">Sin of Greed</button>
        <button class="monetization-tab" data-monetization-tab="merch">Merchandize</button>
      </div>

      <section class="monetization-section active" data-monetization-section="greed">
        <label class="greed-toggle">
          <input type="checkbox" id="greed-enabled">
          <span>Enable Sin of Greed</span>
        </label>

        <div class="greed-stats">
          <div>
            <span>Remaining</span>
            <strong id="greed-remaining">$100.00</strong>
          </div>
          <div>
            <span>Total spent</span>
            <strong id="greed-spent">$0.00</strong>
          </div>
        </div>
        <div id="greed-warning" class="greed-warning">Sin of Greed is sleeping. No actions are charged.</div>

        <div class="monetization-fields">
          <label>Wallet budget<input id="greed-budget" type="number" min="0" step="0.01" value="100.00"></label>
          <label>Cost per walk step<input type="number" min="0" step="0.01" data-greed-cost="walk"></label>
          <label>Cost per jump<input type="number" min="0" step="0.01" data-greed-cost="jump"></label>
          <label>Cost per AI agent prompt<input type="number" min="0" step="0.01" data-greed-cost="agentPrompt"></label>
          <label>Cost per 2D texture<input type="number" min="0" step="0.01" data-greed-cost="texture2d"></label>
          <label>Cost per 3D model<input type="number" min="0" step="0.01" data-greed-cost="model3d"></label>
          <label>Cost per GLB export<input type="number" min="0" step="0.01" data-greed-cost="glbExport"></label>
        </div>

        <button id="greed-reset" class="upload-button monetization-wide-btn">Reset Budget</button>
        <div id="greed-log" class="greed-log"></div>
      </section>

      <section class="monetization-section" data-monetization-section="merch">
        <div class="monetization-fields">
          <label>Asset type
            <select id="merch-asset-type">
              <option value="2d">2D</option>
              <option value="3d">3D GLB</option>
            </select>
          </label>
          <label>Merch type
            <select id="merch-type"></select>
          </label>
          <label>Platform
            <select id="merch-platform">
              <option value="etsy">Etsy</option>
              <option value="shopify">Shopify</option>
              <option value="gumroad">Gumroad</option>
              <option value="redbubble">Redbubble</option>
              <option value="printful">Printful</option>
              <option value="kickstarter">Kickstarter</option>
              <option value="tiktok-shop">TikTok Shop</option>
            </select>
          </label>
          <label>Describe the asset/character
            <input id="merch-description" type="text" placeholder="e.g. chrome bus wizard with bad accounting">
          </label>
        </div>
        <div class="monetization-actions">
          <button id="merch-generate-strategy" class="upload-button">Generate Merch Strategy</button>
          <button id="merch-draft-copy" class="upload-button" disabled>Draft Launch Copy</button>
        </div>
        <div id="merch-strategy-output" class="monetization-output"></div>
        <div id="merch-copy-output" class="monetization-output"></div>
      </section>
    </div>
  </div>

  <div id="panel">
    <div class="panel-header">
      <h2>Sketch & Prompt</h2>
      <button id="close-panel-btn" class="close-btn">&times;</button>
    </div>

    <div class="canvas-container">
      <canvas id="sketch-canvas" width="1024" height="1024"></canvas>
      
      <div class="toolbar">
        <button id="pen-tool" class="tool-btn active" title="Pen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          </svg>
        </button>
        <button id="eraser-tool" class="tool-btn" title="Eraser">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 20H7L3 16 13 6l7 7z"></path>
          </svg>
        </button>
        
        <div class="divider"></div>
        
        <input type="color" id="color-picker" value="#000000" title="Color">
        
        <div class="brush-size-container">
          <label for="brush-size" title="Brush Size">Size:</label>
          <input type="range" id="brush-size" min="1" max="60" value="8">
          <span id="brush-size-value">8</span>
        </div>
        
        <div class="divider"></div>
        
        <button id="clear-canvas" class="tool-btn danger" title="Clear Canvas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="prompt-section">
      <label for="prompt-input">Prompt:</label>
      <textarea id="prompt-input" placeholder="e.g. Make the player move faster, add a double jump, change gravity..." rows="4"></textarea>
      <button id="submit-prompt-btn" class="submit-btn">
        <span id="submit-label">Run Agent</span>
      </button>
    </div>

    <div id="agent-result" class="agent-result" style="display:none;"></div>

    <div class="upload-section">
      <button id="upload-btn" class="upload-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Upload Image
      </button>
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <span id="file-name"></span>
      <div id="match-result" class="match-result"></div>
    </div>

    <div class="generate-section">
      <label for="sprite-select" class="result-label">Base 3D model</label>
      <select id="sprite-select">
        <option value="">(none — generate from scratch)</option>
      </select>
      <label for="provider-select" class="result-label">3D provider</label>
      <select id="provider-select">
        <option value="stable-fast" selected>Stable Fast 3D (~3s)</option>
        <option value="replicate-triposr">TripoSR via Replicate (~10s)</option>
        <option value="triposr">TripoSR via own AWS EC2 (~5s)</option>
        <option value="meshy">Meshy (1–3 min, higher quality)</option>
      </select>
      <div class="generate-buttons">
        <button id="generate-2d-btn" class="upload-button">Generate 2D</button>
        <button id="generate-3d-btn" class="upload-button" disabled>Generate 3D</button>
      </div>
    </div>

    <div id="generate-result" class="generate-result" style="display:none;">
      <h3>Result</h3>
      <div class="result-row">
        <div>
          <div class="result-label">2D image</div>
          <img id="result-preview" alt="2D export preview" />
        </div>
        <div class="result-progress-col">
          <div class="result-label">Progress</div>
          <div class="result-progress-bar"><div id="result-progress-fill"></div></div>
          <div id="result-status">idle</div>
        </div>
      </div>
      <div class="result-log" id="result-log"></div>
      <model-viewer
        id="result-glb-viewer"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        ar-status="not-presenting"
        style="display:none; width:100%; height:260px; background:rgba(0,0,0,0.4); border-radius:8px; margin-top:8px;">
      </model-viewer>
      <div id="result-model" class="result-model"></div>
    </div>
  </div>

  <div id="agent-log" class="agent-log floating-log" style="display:none;">
    <div class="agent-log-header">Agent Activity</div>
    <div id="agent-steps"></div>
  </div>

  <!-- Hidden model-viewer used only to render base sprites and capture them
       as 2D images for the canvas. Keep on-screen-but-invisible because
       <model-viewer> needs to be in the layout to render. -->
  <model-viewer
    id="capture-viewer"
    camera-orbit="0deg 80deg auto"
    field-of-view="35deg"
    reveal="auto"
    interaction-prompt="none"
    disable-zoom disable-pan disable-tap
    style="position: fixed; left: -9999px; top: 0; width: 1024px; height: 1024px; pointer-events: none; opacity: 0;">
  </model-viewer>

  <script type="module" src="app.js"></script>
</body>
</html>
